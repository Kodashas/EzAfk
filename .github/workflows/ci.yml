          JAR_NAME=$(curl -fsSL "https://api.papermc.io/v2/projects/folia/versions/${{ matrix.mc_version }}/builds/${BUILD}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['downloads']['application']['name'])")
          echo "build=${BUILD}"       >> "$GITHUB_OUTPUT"
          echo "jar_name=${JAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved: Folia ${{ matrix.mc_version }} build ${BUILD} (${JAR_NAME})"

      - name: Download Folia ${{ matrix.mc_version }} server JAR
        run: |
          mkdir -p smoke-server/plugins
          curl -fsSL \
            "https://api.papermc.io/v2/projects/folia/versions/${{ matrix.mc_version }}/builds/${{ steps.folia.outputs.build }}/downloads/${{ steps.folia.outputs.jar_name }}" \
            -o smoke-server/folia.jar

      - name: Copy plugin JAR
        run: cp target/ezafk-*.jar smoke-server/plugins/EzAfk.jar

      - name: Configure server
        run: |
          echo "eula=true" > smoke-server/eula.txt
          printf '%s\n' \
            "online-mode=false" \
