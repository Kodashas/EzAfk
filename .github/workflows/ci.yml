name: CI

on:
  pull_request:
    branches: [ v2.x, v3.x ]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit (minecraft/v26 HEAD)
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          MBVER="dev-$(git -C /tmp/MockBukkit rev-parse --short HEAD)"
          echo "MOCKBUKKIT_VERSION=$MBVER" >> "$GITHUB_ENV"
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run unit tests
        run: mvn -B -ntp -Dmockbukkit.version="$MOCKBUKKIT_VERSION" test

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit (minecraft/v26 HEAD)
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          MBVER="dev-$(git -C /tmp/MockBukkit rev-parse --short HEAD)"
          echo "MOCKBUKKIT_VERSION=$MBVER" >> "$GITHUB_ENV"
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run feature tests
        run: mvn -B -ntp -Pfeature-tests -Dtest=*FeatureTest -Dmockbukkit.version="$MOCKBUKKIT_VERSION" test

  # ──────────────────────────────────────────────────────────────────────────
  # SMOKE TESTS — verify EzAfk loads without errors on each server platform.
  #
  # All modern smoke jobs build with JDK 25 only:
  #   paper-api 26.x is compiled with Java 25 (class version 69); any JDK
  #   older than 25 cannot read those class files and the build fails.
  #   maven.compiler.release=17 guarantees Java 17 output bytecode, so the
  #   plugin runs on any Java 17+ server regardless of the build JDK.
  #
  # Legacy job (paper-legacy-smoke-test — Paper 1.20.4 / Java 17):
  #   Paper 1.20.4 is the last MC version that accepts Java 17 at runtime.
  #   MC 1.20.5/1.20.6+ require Java 21. The plugin is built with JDK 25
  #   (maven.compiler.release=17 → Java 17 bytecode), then the server is
  #   started with JDK 17 to verify genuine legacy server compatibility.
  #
  # Build uses -Dmaven.test.skip=true (avoids needing the MockBukkit install).
  # ──────────────────────────────────────────────────────────────────────────

  spigot-smoke-test:
    name: Spigot 1.21.4 (build JDK 25 / server JDK 21)
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]
    # BuildTools for Spigot 1.21.4 requires Java 21–24 (javaVersions [65,68]).
    # JDK 25 is rejected by BuildTools even though the server itself runs fine
    # on any Java 21+ JVM. Strategy: compile the plugin with JDK 25 (paper-api
    # 26.x needs it), then swap to JDK 21 for BuildTools and server launch.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up build JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin JAR (JDK 25, java-17 bytecode)
        run: mvn -B -ntp -Dmaven.test.skip=true package

      - name: Set up server JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Spigot 1.21.4 JAR
        id: spigot-cache
        uses: actions/cache@v4
        with:
          path: spigot-1.21.4.jar
          key: spigot-1.21.4-buildtools-v1

      - name: Build Spigot 1.21.4 via BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          git config --global user.email "ci@ci.local"
          git config --global user.name "CI"
          curl -fsSL \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar \
            -o BuildTools.jar
          java -jar BuildTools.jar --rev 1.21.4 --compile SPIGOT

      - name: Configure server
        run: |
          mkdir -p smoke-server/plugins
          cp target/ezafk-*.jar smoke-server/plugins/EzAfk.jar
          cp spigot-1.21.4.jar smoke-server/
          echo "eula=true" > smoke-server/eula.txt
          printf '%s\n' \
            "online-mode=false" \
            "level-type=flat" \
            "generate-structures=false" \
            "max-players=0" \
            > smoke-server/server.properties

      - name: Run server and wait for ready
        run: |
          cd smoke-server
          java -Xms512m -Xmx1g -jar spigot-1.21.4.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          ELAPSED=0
          while [ $ELAPSED -lt 120 ]; do
            sleep 2; ELAPSED=$((ELAPSED + 2))
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "Server ready after ${ELAPSED}s"; break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited after ${ELAPSED}s"; break
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Assert no EzAfk errors
        run: |
          LOG=smoke-server/server.log
          if grep -qiE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"; then
            echo "::error::EzAfk logged errors on Spigot 1.21.4 / Java 21 startup:"
            grep -iE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"
            exit 1
          fi
          if grep -qiE "Enabling EzAfk" "$LOG"; then
            echo "Spigot 1.21.4 / Java 21 smoke test passed."
          else
            echo "::warning::EzAfk 'Enabling EzAfk' not found in log — plugin may not have loaded within the timeout"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spigot-1.21.4-java21-smoke-log
          path: smoke-server/server.log
          retention-days: 7

  paper-smoke-test:
    name: Paper 1.21.11 / Java 25
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin JAR
        run: mvn -B -ntp -Dmaven.test.skip=true package

      - name: Resolve latest Paper 1.21.11 build
        id: paper
        run: |
          BUILD=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds" | \
            python3 -c "import sys,json; builds=json.load(sys.stdin)['builds']; print(builds[-1]['build'])")
          JAR_NAME=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds/${BUILD}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['downloads']['application']['name'])")
          echo "build=${BUILD}"       >> "$GITHUB_OUTPUT"
          echo "jar_name=${JAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved: Paper 1.21.11 build ${BUILD} (${JAR_NAME})"

      - name: Download Paper 1.21.11 server JAR
        run: |
          mkdir -p smoke-server/plugins
          curl -fsSL \
            "https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds/${{ steps.paper.outputs.build }}/downloads/${{ steps.paper.outputs.jar_name }}" \
            -o smoke-server/paper.jar

      - name: Copy plugin JAR
        run: cp target/ezafk-*.jar smoke-server/plugins/EzAfk.jar

      - name: Configure server
        run: |
          echo "eula=true" > smoke-server/eula.txt
          printf '%s\n' \
            "online-mode=false" \
            "level-type=flat" \
            "generate-structures=false" \
            "max-players=0" \
            > smoke-server/server.properties

      - name: Run server and wait for ready
        run: |
          cd smoke-server
          java -Xms512m -Xmx1g -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          ELAPSED=0
          while [ $ELAPSED -lt 120 ]; do
            sleep 2; ELAPSED=$((ELAPSED + 2))
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "Server ready after ${ELAPSED}s"; break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited after ${ELAPSED}s"; break
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Assert no EzAfk errors
        run: |
          LOG=smoke-server/server.log
          if grep -qiE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"; then
            echo "::error::EzAfk logged errors on Paper 1.21.11 / Java 25 startup:"
            grep -iE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"
            exit 1
          fi
          if grep -qiE "Enabling EzAfk" "$LOG"; then
            echo "Paper 1.21.11 / Java 25 smoke test passed."
          else
            echo "::warning::EzAfk 'Enabling EzAfk' not found in log — plugin may not have loaded within the timeout"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-1.21.11-java25-smoke-log
          path: smoke-server/server.log
          retention-days: 7

