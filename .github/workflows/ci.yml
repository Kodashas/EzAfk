name: CI

on:
  pull_request:
    branches: [ v2.x, v3.x ]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit (minecraft/v26 HEAD)
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          MBVER="dev-$(git -C /tmp/MockBukkit rev-parse --short HEAD)"
          echo "MOCKBUKKIT_VERSION=$MBVER" >> "$GITHUB_ENV"
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run unit tests
        run: mvn -B -ntp -Dmockbukkit.version="$MOCKBUKKIT_VERSION" test

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install MockBukkit (minecraft/v26 HEAD)
        run: |
          git clone --depth=1 --branch minecraft/v26 https://github.com/MockBukkit/MockBukkit.git /tmp/MockBukkit
          MBVER="dev-$(git -C /tmp/MockBukkit rev-parse --short HEAD)"
          echo "MOCKBUKKIT_VERSION=$MBVER" >> "$GITHUB_ENV"
          cd /tmp/MockBukkit && ./gradlew publishToMavenLocal -xtest -xjavadoc

      - name: Run feature tests
        run: mvn -B -ntp -Pfeature-tests -Dtest=*FeatureTest -Dmockbukkit.version="$MOCKBUKKIT_VERSION" test

  # ──────────────────────────────────────────────────────────────────────────
  # SMOKE TESTS — verify EzAfk loads without errors on each server platform.
  # Matrix covers key stable 1.21.x releases × Java 21 & 25.
  # Build uses -Dmaven.test.skip=true to skip test-compile (avoids needing
  # the MockBukkit local install that only the unit/feature-test jobs prepare).
  # ──────────────────────────────────────────────────────────────────────────

  spigot-smoke-test:
    name: Spigot 1.21.4 / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build plugin JAR
        run: mvn -B -ntp -Dmaven.test.skip=true package

      - name: Cache Spigot 1.21.4 JAR
        id: spigot-cache
        uses: actions/cache@v4
        with:
          path: spigot-1.21.4.jar
          key: spigot-1.21.4-buildtools-v1

      - name: Build Spigot 1.21.4 via BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          git config --global user.email "ci@ci.local"
          git config --global user.name "CI"
          curl -fsSL \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar \
            -o BuildTools.jar
          java -jar BuildTools.jar --rev 1.21.4 --compile SPIGOT

      - name: Configure server
        run: |
          mkdir -p smoke-server/plugins
          cp target/ezafk-*.jar smoke-server/plugins/EzAfk.jar
          cp spigot-1.21.4.jar smoke-server/
          echo "eula=true" > smoke-server/eula.txt
          printf '%s\n' \
            "online-mode=false" \
            "level-type=flat" \
            "generate-structures=false" \
            "max-players=0" \
            > smoke-server/server.properties

      - name: Run server and wait for ready
        run: |
          cd smoke-server
          java -Xms512m -Xmx1g -jar spigot-1.21.4.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          ELAPSED=0
          while [ $ELAPSED -lt 120 ]; do
            sleep 2; ELAPSED=$((ELAPSED + 2))
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "Server ready after ${ELAPSED}s"; break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited after ${ELAPSED}s"; break
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Assert no EzAfk errors
        run: |
          LOG=smoke-server/server.log
          if grep -qiE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"; then
            echo "::error::EzAfk logged errors on Spigot 1.21.4 / Java ${{ matrix.java }} startup:"
            grep -iE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"
            exit 1
          fi
          if grep -qiE "Enabling EzAfk" "$LOG"; then
            echo "Spigot 1.21.4 / Java ${{ matrix.java }} smoke test passed."
          else
            echo "::warning::EzAfk 'Enabling EzAfk' not found in log — plugin may not have loaded within the timeout"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spigot-1.21.4-java${{ matrix.java }}-smoke-log
          path: smoke-server/server.log
          retention-days: 7

  paper-smoke-test:
    name: Paper ${{ matrix.mc_version }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]
    strategy:
      fail-fast: false
      matrix:
        mc_version: ['1.21', '1.21.1', '1.21.4', '1.21.8', '1.21.11']
        java: [21, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build plugin JAR
        run: mvn -B -ntp -Dmaven.test.skip=true package

      - name: Resolve latest Paper ${{ matrix.mc_version }} build
        id: paper
        run: |
          BUILD=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/${{ matrix.mc_version }}/builds" | \
            python3 -c "import sys,json; builds=json.load(sys.stdin)['builds']; print(builds[-1]['build'])")
          JAR_NAME=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/${{ matrix.mc_version }}/builds/${BUILD}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['downloads']['application']['name'])")
          echo "build=${BUILD}"       >> "$GITHUB_OUTPUT"
          echo "jar_name=${JAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved: Paper ${{ matrix.mc_version }} build ${BUILD} (${JAR_NAME})"

      - name: Download Paper ${{ matrix.mc_version }} server JAR
        run: |
          mkdir -p smoke-server/plugins
          curl -fsSL \
            "https://api.papermc.io/v2/projects/paper/versions/${{ matrix.mc_version }}/builds/${{ steps.paper.outputs.build }}/downloads/${{ steps.paper.outputs.jar_name }}" \
            -o smoke-server/paper.jar

      - name: Copy plugin JAR
        run: cp target/ezafk-*.jar smoke-server/plugins/EzAfk.jar

      - name: Configure server
        run: |
          echo "eula=true" > smoke-server/eula.txt
          printf '%s\n' \
            "online-mode=false" \
            "level-type=flat" \
            "generate-structures=false" \
            "max-players=0" \
            > smoke-server/server.properties

      - name: Run server and wait for ready
        run: |
          cd smoke-server
          java -Xms512m -Xmx1g -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          ELAPSED=0
          while [ $ELAPSED -lt 120 ]; do
            sleep 2; ELAPSED=$((ELAPSED + 2))
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "Server ready after ${ELAPSED}s"; break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited after ${ELAPSED}s"; break
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Assert no EzAfk errors
        run: |
          LOG=smoke-server/server.log
          if grep -qiE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"; then
            echo "::error::EzAfk logged errors on Paper ${{ matrix.mc_version }} / Java ${{ matrix.java }} startup:"
            grep -iE "SEVERE.*[Ee]z[Aa]fk|Could not load.*[Ee]z[Aa]fk|Error.*[Ee]z[Aa]fk" "$LOG"
            exit 1
          fi
          if grep -qiE "Enabling EzAfk" "$LOG"; then
            echo "Paper ${{ matrix.mc_version }} / Java ${{ matrix.java }} smoke test passed."
          else
            echo "::warning::EzAfk 'Enabling EzAfk' not found in log — plugin may not have loaded within the timeout"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.mc_version }}-java${{ matrix.java }}-smoke-log
          path: smoke-server/server.log
          retention-days: 7

  folia-smoke-test:
    name: Folia ${{ matrix.mc_version }} / Java ${{ matrix.java }}
